services:
  liftosaur2garmin:
    # Published on each GitHub release. Pin a version (e.g. :1.1.0) instead of :latest if you prefer.
    image: ghcr.io/jeffs24/liftosaur2garmin:latest
    # To build from source instead, comment out `image` above and uncomment:
    # build: .
    container_name: liftosaur2garmin
    restart: unless-stopped
    ports:
      - "8124:8124"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - l2g-data:/data

volumes:
  l2g-data:
